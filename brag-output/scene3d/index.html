<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #0a0c0b; overflow: hidden; }
  canvas { display: block; }
</style>
<script type="importmap">{ "imports": { "three": "./three.module.js" } }</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

const W = 1920, H = 1080;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.setClearColor(0x0a0c0b, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, W / H, 1, 1000);

scene.add(new THREE.HemisphereLight(0xdfe8e2, 0x0a0c0b, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(120, 180, 140);
scene.add(key);
const rim = new THREE.DirectionalLight(0xe0352b, 0.5);
rim.position.set(-160, 60, -120);
scene.add(rim);

// binary STL -> BufferGeometry, mm units
function parseSTL(buf) {
  const dv = new DataView(buf);
  const n = dv.getUint32(80, true);
  const pos = new Float32Array(n * 9);
  for (let i = 0; i < n; i++) {
    const off = 84 + i * 50 + 12;
    for (let k = 0; k < 9; k++) pos[i * 9 + k] = dv.getFloat32(off + k * 4, true);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return g;
}

const CASE_COLOR = 0x2d6a4f;
const caseMat = new THREE.MeshStandardMaterial({ color: CASE_COLOR, roughness: 0.55, metalness: 0.05 });

// the enclosure is 91 x 71.5 mm; center it on x/y
const CX = 43.5, CY = 34.25;
const baseGroup = new THREE.Group();
const lidGroup = new THREE.Group();
scene.add(baseGroup, lidGroup);

// internals, placed under the lid cutouts (enclosure frame, mm; the lid plate sits at z 12.6-14.6)
// display module behind the 44 x 16 mm window centered at (42, 20)
const pcbMat = new THREE.MeshStandardMaterial({ color: 0x0f4a2b, roughness: 0.6 });
const pcb = new THREE.Mesh(new THREE.BoxGeometry(50, 24, 1.6), pcbMat);
pcb.position.set(42, 20, 10);
baseGroup.add(pcb);

function digitsTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 352;
  const g = c.getContext('2d');
  g.fillStyle = '#120404';
  g.fillRect(0, 0, 1024, 352);
  g.fillStyle = '#ff3b2e';
  g.font = 'bold 300px ui-monospace, DejaVu Sans Mono, monospace';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.shadowColor = 'rgba(255,59,46,0.9)';
  g.shadowBlur = 30;
  g.fillText('07:30', 512, 186);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const digitsMap = digitsTexture();
const displayMat = new THREE.MeshStandardMaterial({ map: digitsMap, emissive: 0xffffff, emissiveMap: digitsMap, emissiveIntensity: 0.9, roughness: 0.25 });
const display = new THREE.Mesh(new THREE.BoxGeometry(42, 14.5, 3.6), displayMat);
display.position.set(42, 20, 10.8 + 1.8);
baseGroup.add(display);

// buzzer under the vent grille at (16, 56)
const buzzerMat = new THREE.MeshStandardMaterial({ color: 0x1d1d1d, roughness: 0.4 });
const buzzer = new THREE.Mesh(new THREE.CylinderGeometry(6, 6, 10, 40), buzzerMat);
buzzer.rotation.x = Math.PI / 2;
buzzer.position.set(16, 55.7, 2 + 5);
baseGroup.add(buzzer);
const buzzerTop = new THREE.Mesh(new THREE.CylinderGeometry(5.2, 5.2, 0.8, 40), new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.2 }));
buzzerTop.rotation.x = Math.PI / 2;
buzzerTop.position.set(16, 55.7, 12.4);
baseGroup.add(buzzerTop);

// four button caps through the 7 mm holes at y = 54
const capMat = new THREE.MeshStandardMaterial({ color: 0x161616, roughness: 0.5 });
[37.2, 48.8, 59.2, 69.8].forEach((x) => {
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 7, 32), capMat);
  cap.rotation.x = Math.PI / 2;
  cap.position.set(x, 54.2, 12.5);
  baseGroup.add(cap);
});

// four red LEDs through the 4.5 mm holes at y = 5
const ledMat = new THREE.MeshStandardMaterial({ color: 0xe0352b, emissive: 0xe0352b, emissiveIntensity: 0.8, roughness: 0.2 });
[45.0, 52.5, 59.5, 66.5].forEach((x) => {
  const led = new THREE.Mesh(new THREE.CylinderGeometry(2.1, 2.1, 6, 24), ledMat);
  led.rotation.x = Math.PI / 2;
  led.position.set(x, 5.3, 12.2);
  baseGroup.add(led);
  const dome = new THREE.Mesh(new THREE.SphereGeometry(2.1, 24, 12), ledMat);
  dome.position.set(x, 5.3, 15.2);
  baseGroup.add(dome);
});

// load STLs (served from the same folder)
const loader = (url) => fetch(url).then(r => r.arrayBuffer()).then(parseSTL);
let ready = Promise.all([loader('base.stl'), loader('lid.stl')]).then(([gb, gl]) => {
  const base = new THREE.Mesh(gb, caseMat);
  const lid = new THREE.Mesh(gl, caseMat);
  base.position.set(-CX, -CY, 0);
  lid.position.set(-CX, -CY, 0);
  baseGroup.position.set(0, 0, 0);
  baseGroup.add(base);
  lidGroup.add(lid);
  // internals sit inside the base; they are authored in the enclosure's own frame
  // (with CX/CY already applied), so shift them to match the centered mesh
  baseGroup.children.forEach(c => { if (c !== base) c.position.x -= CX, c.position.y -= CY; });
  // the shared footprint offset: display/buzzer were placed around CX/CY above
  return true;
});

// seat the lid on the wall ring at z = 12.6 mm
// the shot runs 4.3s; the lid hits the base at 0.3s (beat-locked to 4.6s in the edit)
const WALL_TOP = 12.6;
const DUR = 4.3;
const IMPACT = 0.3;
const easeOut = (x) => 1 - Math.pow(1 - x, 3);

window.setFrame = function (t) {
  const tau = t * DUR;
  let lidZ;
  if (tau < IMPACT) lidZ = WALL_TOP + 70 * (1 - Math.pow(tau / IMPACT, 2));
  else if (tau < IMPACT + 0.14) lidZ = WALL_TOP + 1.8 * Math.sin(Math.PI * (tau - IMPACT) / 0.14);
  else lidZ = WALL_TOP;
  lidGroup.position.z = lidZ;

  // low push-in orbit
  const k = easeOut(Math.min(1, tau / DUR));
  const theta = 1.0 + k * 0.55;
  const dist = 300 - k * 70;
  const height = 120 - k * 50;
  let shake = 0;
  if (tau > IMPACT) shake = 5 * Math.sin((tau - IMPACT) * 70) * Math.exp(-(tau - IMPACT) * 10);
  camera.position.set(Math.cos(theta) * dist + shake, height + shake * 0.6, Math.sin(theta) * dist);
  camera.lookAt(0, -6, 0);
  renderer.render(scene, camera);
  return true;
};

window.ready = ready.then(() => { window.setFrame(0); return true; });
</script>
</body>
</html>
